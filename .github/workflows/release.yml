name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Tags like v1.2.3 build version 1.2.3
      # AOT training needs a display
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="-PcliVersion=${GITHUB_REF_NAME#v}"; fi
          if [ "$RUNNER_OS" = Linux ]; then
            command -v xvfb-run || sudo apt-get install -y xvfb
            display="xvfb-run -a"
          fi
          $display ./gradlew release $version

      - name: Collect archive
        run: |
          mkdir dist
          cp build/distributions/ProcessingCLI-* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ProcessingCLI-${{ runner.os }}-${{ runner.arch }}
          path: dist/

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't do the newer AWS checksums
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: s3://${{ secrets.R2_BUCKET }}/processingcli
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload version
        run: |
          version="${GITHUB_REF_NAME#v}"
          aws s3 cp dist/ "$BUCKET/$version/" --recursive --endpoint-url "$R2" \
            --cache-control "public, max-age=31536000, immutable"

      # Last, after the files it lists
      - name: Update latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Keyed like windows-x64
          entries=$(cd dist && for sum in *.sha256; do
            file="${sum%.sha256}"
            key="${file#ProcessingCLI-}"
            key="${key%%.*}"
            echo "\"$key\": {\"url\": \"$version/$file\", \"sha256\": \"$(cut -d' ' -f1 "$sum")\"}"
          done | paste -sd, -)
          echo "{\"version\": \"$version\", \"files\": {$entries}}" > latest.json
          cat latest.json
          aws s3 cp latest.json "$BUCKET/latest.json" --endpoint-url "$R2" \
            --cache-control "no-cache" --content-type application/json
